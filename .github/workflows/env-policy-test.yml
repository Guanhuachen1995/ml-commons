name: env-policy-test
on:
  push:
    branches: ['test/env-policy-push', 'gh-readonly-queue/**']
  pull_request:
permissions:
  contents: read
jobs:
  env-job:
    runs-on: ubuntu-latest
    environment: policy-test
    steps:
      - run: echo "event=${{ github.event_name }} ref=${{ github.ref }} head_ref=${{ github.head_ref }}"
